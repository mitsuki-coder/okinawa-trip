<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌺 沖縄旅行しおり & マップ (リアルタイム同期版)</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --primary-color: #00a896;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: #333; }

    header {
      background: var(--primary-color);
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .sync-status {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd166;
    }

    .status-dot.online {
      background: #06d6a0;
    }

    .btn-group { display: flex; gap: 8px; }
    button, label.btn {
      background: white;
      color: var(--primary-color);
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }
    button:hover, label.btn:hover { opacity: 0.9; }
    input[type="file"] { display: none; }

    .container {
      display: grid;
      grid-template-columns: 1fr 380px;
      height: calc(100vh - 60px);
    }

    #map { width: 100%; height: 100%; }

    .sidebar {
      background: var(--card-bg);
      border-left: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .form-container {
      padding: 15px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
    }

    .form-container h3 { font-size: 0.95rem; margin-bottom: 8px; color: var(--primary-color); }
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 0.75rem; color: #666; margin-bottom: 2px; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .search-box {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .legend-box {
      background: #fff;
      padding: 8px 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      gap: 10px;
      justify-content: space-around;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .timeline-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .timeline-item {
      position: relative;
      padding-left: 20px;
      margin-bottom: 15px;
      border-left: 3px solid #ccc;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -7px;
      top: 0;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #888;
    }

    .time-badge { font-size: 0.75rem; font-weight: bold; }
    .spot-title { font-size: 0.95rem; font-weight: bold; margin: 2px 0; }
    .spot-memo { font-size: 0.85rem; color: #555; white-space: pre-wrap; }
    .actions { margin-top: 5px; display: flex; gap: 8px; }
    .action-btn { background: none; color: #888; padding: 0; font-size: 0.75rem; text-decoration: underline; border: none; cursor: pointer; }
    .action-btn.delete { color: #e63946; }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h2>🌺 沖縄旅行しおり & マップ</h2>
    <div style="display: flex; align-items: center; gap: 15px;">
      <div class="sync-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">接続中...</span>
      </div>
      <div class="btn-group">
        <label class="btn">
          JSONファイルを読み込む
          <input type="file" id="importFile" accept=".json" onchange="importData(event)">
        </label>
      </div>
    </div>
  </header>

  <div class="container">
    <div id="map"></div>
    
    <div class="sidebar">
      <div class="form-container">
        <h3>1. 住所・施設名から位置を調べる</h3>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="例: 美ら海水族館 または 那覇市首里金城町" onkeydown="if(event.key==='Enter') searchAddress()">
          <button onclick="searchAddress()" style="background:#555; color:white; flex-shrink: 0;">検索</button>
        </div>

        <h3>2. スポット情報を入力</h3>
        <div class="form-group">
          <label>日時 (※日付でピンの色が変わります)</label>
          <input type="datetime-local" id="spotTime">
        </div>
        <div class="form-group">
          <label>スポット名 / 目的</label>
          <input type="text" id="spotName" placeholder="例: 首里城公園">
        </div>
        <div class="form-group">
          <label>メモ (予算・予約情報など)</label>
          <textarea id="spotMemo" rows="2" placeholder="例: 入場料800円"></textarea>
        </div>
        <input type="hidden" id="spotLat">
        <input type="hidden" id="spotLng">
        <button onclick="addSpot()" style="width:100%; background: var(--primary-color); color: white;">クラウドに登録する</button>
      </div>

      <div class="legend-box">
        <div class="legend-item"><span class="color-dot" style="background:#e63946;"></span>9/13 (Day 1)</div>
        <div class="legend-item"><span class="color-dot" style="background:#1d3557;"></span>9/14 (Day 2)</div>
        <div class="legend-item"><span class="color-dot" style="background:#2a9d8f;"></span>9/15 (Day 3)</div>
        <div class="legend-item"><span class="color-dot" style="background:#70161e;"></span>9/16 (Day 4)</div>
      </div>

      <div class="timeline-container">
        <h3 style="font-size: 1rem; margin-bottom: 12px;">時系列スケジュール (全端末リアルタイム同期)</h3>
        <div id="timeline"></div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK (v10 Database) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getDatabase, 
      ref, 
      push, 
      remove, 
      onValue 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4DwycXGEn82FBN8lK-rVQndH6aBd5xWU",
      authDomain: "okinawa-trip-1382f.firebaseapp.com",
      projectId: "okinawa-trip-1382f",
      storageBucket: "okinawa-trip-1382f.firebasestorage.app",
      messagingSenderId: "633450144617",
      appId: "1:633450144617:web:62eb29737b594f706293f8",
      measurementId: "G-KHMT401B58"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const spotsRef = ref(db, "okinawa_spots");

    const DEFAULT_LAT = 26.2124;
    const DEFAULT_LNG = 127.6809;
    
    let map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LNG], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let currentSpots = [];
    let tempMarker = null;
    let markers = [];

    const COLOR_CONFIG = {
      "09-13": { name: "red", hex: "#e63946" },
      "09-14": { name: "blue", hex: "#1d3557" },
      "09-15": { name: "green", hex: "#2a9d8f" },
      "09-16": { name: "violet", hex: "#70161e" },
      "default": { name: "grey", hex: "#888888" }
    };

    function createCustomIcon(colorName) {
      return new L.Icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${colorName}.png`,
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      });
    }

    function getDayColor(timeStr) {
      if (!timeStr) return COLOR_CONFIG["default"];
      const dateStr = timeStr.slice(5, 10);
      return COLOR_CONFIG[dateStr] || COLOR_CONFIG["default"];
    }

    // リアルタイム同期受信
    onValue(spotsRef, (snapshot) => {
      currentSpots = [];
      const data = snapshot.val();
      
      if (data) {
        Object.keys(data).forEach((key) => {
          currentSpots.push({ id: key, ...data[key] });
        });
        currentSpots.sort((a, b) => new Date(a.time || 0) - new Date(b.time || 0));
      }

      document.getElementById('statusDot').classList.add('online');
      document.getElementById('statusText').innerText = 'リアルタイム同期完了';

      renderTimeline();
      renderMapMarkers();
    }, (error) => {
      console.error("Database同期エラー:", error);
      document.getElementById('statusDot').classList.remove('online');
      document.getElementById('statusText').innerText = '同期エラー (Databaseの有効化を確認してください)';
    });

    // スポット追加
    window.addSpot = async function() {
      const name = document.getElementById('spotName').value.trim();
      const time = document.getElementById('spotTime').value;
      const memo = document.getElementById('spotMemo').value.trim();
      let lat = parseFloat(document.getElementById('spotLat').value);
      let lng = parseFloat(document.getElementById('spotLng').value);

      if (!name) return alert('スポット名を入力してください');
      
      if (isNaN(lat) || isNaN(lng)) {
        lat = DEFAULT_LAT;
        lng = DEFAULT_LNG;
      }

      try {
        await push(spotsRef, { name, time, memo, lat, lng });
        resetForm();
      } catch (e) {
        alert("追加に失敗しました: " + e.message);
      }
    };

    // 既存JSONファイルの読み込み & クラウド同期
    window.importData = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const importedSpots = JSON.parse(e.target.result);
          if (Array.isArray(importedSpots)) {
            let count = 0;
            for (const item of importedSpots) {
              if (item.name) {
                await push(spotsRef, {
                  name: item.name || '',
                  time: item.time || '',
                  memo: item.memo || '',
                  lat: parseFloat(item.lat) || DEFAULT_LAT,
                  lng: parseFloat(item.lng) || DEFAULT_LNG
                });
                count++;
              }
            }
            alert(`${count}件のデータを正常にクラウドへ取り込みました！`);
          } else {
            alert('不正なファイル形式です。配列形式のJSONを選択してください。');
          }
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    };

    // スポット削除
    window.deleteSpot = async function(docId) {
      if (!confirm('このスポットを削除しますか？\n（全員の画面からも削除されます）')) return;
      try {
        await remove(ref(db, `okinawa_spots/${docId}`));
      } catch (e) {
        alert("削除に失敗しました: " + e.message);
      }
    };

    map.on('click', function(e) {
      setTempLocation(e.latlng.lat, e.latlng.lng, "選択した位置");
    });

    window.searchAddress = async function() {
      const queryStr = document.getElementById('searchInput').value.trim();
      if (!queryStr) return alert('住所または施設名を入力してください');

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryStr)}`);
        const data = await response.json();

        if (data && data.length > 0) {
          const result = data[0];
          const lat = parseFloat(result.lat);
          const lng = parseFloat(result.lon);

          map.setView([lat, lng], 14);
          setTempLocation(lat, lng, result.display_name);

          if (!document.getElementById('spotName').value) {
            document.getElementById('spotName').value = queryStr;
          }
        } else {
          alert('該当する住所・施設が見つかりませんでした。');
        }
      } catch (err) {
        alert('検索中にエラーが発生しました。');
      }
    };

    function setTempLocation(lat, lng, label) {
      document.getElementById('spotLat').value = lat;
      document.getElementById('spotLng').value = lng;

      if (tempMarker) map.removeLayer(tempMarker);
      tempMarker = L.marker([lat, lng]).addTo(map).bindPopup(label).openPopup();
    }

    function resetForm() {
      document.getElementById('searchInput').value = '';
      document.getElementById('spotName').value = '';
      document.getElementById('spotTime').value = '';
      document.getElementById('spotMemo').value = '';
      document.getElementById('spotLat').value = '';
      document.getElementById('spotLng').value = '';
      if (tempMarker) map.removeLayer(tempMarker);
    }

    function renderTimeline() {
      const container = document.getElementById('timeline');
      container.innerHTML = '';

      if (currentSpots.length === 0) {
        container.innerHTML = '<p style="font-size:0.85rem; color:#888;">登録されたスポットがありません。</p>';
        return;
      }

      currentSpots.forEach(spot => {
        const item = document.createElement('div');
        item.className = 'timeline-item';
        
        const colorInfo = getDayColor(spot.time);
        item.style.borderLeftColor = colorInfo.hex;

        const formattedTime = spot.time ? new Date(spot.time).toLocaleString('ja-JP', {
          month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '日時未設定';

        item.innerHTML = `
          <style>
            .timeline-item[data-id="${spot.id}"]::before { background: ${colorInfo.hex}; }
          </style>
          <div class="time-badge" style="color: ${colorInfo.hex};">${formattedTime}</div>
          <div class="spot-title">${escapeHtml(spot.name)}</div>
          ${spot.memo ? `<div class="spot-memo">${escapeHtml(spot.memo)}</div>` : ''}
          <div class="actions">
            <button class="action-btn" onclick="focusMap(${spot.lat}, ${spot.lng})">地図で表示</button>
            <button class="action-btn delete" onclick="deleteSpot('${spot.id}')">削除</button>
          </div>
        `;
        item.setAttribute('data-id', spot.id);
        container.appendChild(item);
      });
    }

    function renderMapMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      currentSpots.forEach(spot => {
        const colorInfo = getDayColor(spot.time);
        const icon = createCustomIcon(colorInfo.name);

        const marker = L.marker([spot.lat, spot.lng], { icon: icon }).addTo(map);
        const formattedTime = spot.time ? new Date(spot.time).toLocaleString('ja-JP', {
          month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '';
        
        marker.bindPopup(`<b>${escapeHtml(spot.name)}</b><br>${formattedTime}<br>${escapeHtml(spot.memo)}`);
        markers.push(marker);
      });
    }

    window.focusMap = function(lat, lng) {
      map.setView([lat, lng], 14);
    };

    function escapeHtml(str) {
      return str ? str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
    }
  </script>
</body>
</html>
